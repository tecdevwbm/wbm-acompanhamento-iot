name: Robô Diário (08:15) e Snapshot MQTT

on:
  schedule:
    - cron: '15 11 * * 1-5'   # 08:15 BRT (Segunda a Sexta) - Envio Automático para Google Forms
    - cron: '0 */2 * * *'     # A cada 2 horas - Apenas atualiza snapshot MQTT
  workflow_dispatch:
    inputs:
      auto_submit_forms:
        description: 'Enviar acompanhamentos ao Google Forms agora? (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  sync-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Coletar Telemetria MQTT (AWS 52.67.133.240 + ORACLE 163.176.56.133)
        run: |
          node -e "
            const fs = require('fs');
            const fn = require('./api/snapshot.js');
            const current = JSON.parse(fs.readFileSync('./webapp/mqtt_snapshot.json', 'utf8'));
            const res = {
              setHeader(){},
              status(){ return this; },
              json(data){
                for (const [k, v] of Object.entries(data.devices || {})) {
                  if (current.devices[k]) {
                    current.devices[k].latest = { ...(current.devices[k].latest || {}), ...(v.latest || {}) };
                    if (v.last_seen) current.devices[k].last_seen = v.last_seen;
                  } else {
                    current.devices[k] = v;
                  }
                }
                current.updated_at = new Date().toISOString();
                if (data.recent_log && data.recent_log.length) current.recent_log = data.recent_log;
                fs.writeFileSync('./webapp/mqtt_snapshot.json', JSON.stringify(current, null, 2));
                console.log('Snapshot atualizado com sucesso!');
              }
            };
            fn({method:'GET'}, res);
          "

      - name: Executar Robô Automático das 08:15 (Seg-Sex) -> Google Forms
        if: github.event.schedule == '15 11 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.auto_submit_forms == 'true')
        run: node ./scripts/auto_submit_forms.js

      - name: Salvar Snapshot e Histórico da Nuvem
        run: |
          git config user.name "WBM MQTT Bot"
          git config user.email "tecnico2@wbmtechnology.com.br"
          git add webapp/mqtt_snapshot.json webapp/cloud_submissions_history.json
          git diff --staged --quiet || (git commit -m "chore: snapshot MQTT e envio automático 08:15" && git push)
